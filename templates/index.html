<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Spotify Mood Recommender</title>
  <style>
    body { font-family: system-ui, Arial; background: #080808; color: #ffef00; margin:0; display:flex; justify-content:center; align-items:center; min-height:100vh; }
    .card { background:#0f0f0f; padding:22px; border-radius:14px; width:92%; max-width:720px; box-shadow:0 10px 30px rgba(0,0,0,0.6); }
    h1 { margin:0 0 12px; color:#ffd500; font-size:28px; text-align:center; }
    .row { display:grid; grid-template-columns: 1fr 1fr auto; gap:10px; align-items:center; }
    @media(max-width:700px){ .row{ grid-template-columns:1fr; } }
    input { padding:12px; border-radius:10px; border:2px solid #222; background:#0d0d0d; color:#fff; }
    button { padding:12px 16px; border-radius:10px; border:none; background:#ffd500; color:#000; font-weight:700; cursor:pointer; }
    .error { color:#ff6b6b; margin-top:12px; font-weight:700; text-align:center; }
    .results { margin-top:14px; display:grid; gap:10px; }
    .song { display:grid; grid-template-columns:64px 1fr auto; gap:10px; background:#111; padding:10px; border-radius:10px; align-items:center; }
    .thumb { width:64px;height:64px; object-fit:cover;border-radius:8px; background:#222; }
    .meta { color:#d6d6d6; font-size:13px; }
    a.open { color:#ffd500; text-decoration:none; font-weight:700; }
  </style>
</head>
<body>
  <div class="card">
    <h1> Mood Song Recommender</h1>

    <div class="row">
      <input id="mood" placeholder="mood (happy, sad, chill...)" />
      <input id="language" placeholder="language (english, hindi...)" />
      <button id="go">Get Songs</button>
    </div>

    <div id="error" class="error"></div>
    <div id="results" class="results"></div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const go = $('go');

    async function fetchSongs(mood, language) {
      const res = await fetch('/get-songs', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ mood, language })
      });
      const json = await res.json().catch(() => ({}));
      return { ok: res.ok, status: res.status, data: json };
    }

    function renderSongs(data) {
      const results = $('results');
      results.innerHTML = '';
      (data.songs || []).forEach(s => {
        const div = document.createElement('div');
        div.className = 'song';
        div.innerHTML = `
          <img class="thumb" src="${s.album_art || ''}" alt="">
          <div>
            <div style="font-weight:800">${s.name || 'Unknown'}</div>
            <div class="meta">${s.artists || ''}</div>
            ${s.preview_url ? `<audio src="${s.preview_url}" controls style="margin-top:8px;width:100%"></audio>` : ''}
          </div>
          <div>
            <a class="open" href="${s.url || '#'}" target="_blank">Open</a>
          </div>
        `;
        results.appendChild(div);
      });
    }

    go.addEventListener('click', async () => {
      $('error').textContent = '';
      $('results').innerHTML = '';
      const mood = $('mood').value.trim();
      const language = $('language').value.trim();
      if (!mood && !language) { $('error').textContent = 'Enter at least a mood or language.'; return; }

      go.disabled = true; go.textContent = 'Loading...';

      try {
        const { ok, status, data } = await fetchSongs(mood, language);
        if (!ok) {
          // show server provided error if available
          $('error').textContent = data && data.error ? data.error : `Server error (status ${status})`;
        } else {
          renderSongs(data);
          if (!data.songs || data.songs.length === 0) {
            $('error').textContent = 'No tracks found for that mood/language.';
          }
        }
      } catch (e) {
        $('error').textContent = 'Network or other error: ' + (e.message || e);
      } finally {
        go.disabled = false; go.textContent = 'Get Songs';
      }
    });
  </script>
</body>
</html>
