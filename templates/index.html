<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Mood Recommender</title>
<link rel="icon" href="/static/favicon.ico">

<style>

*{
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:#0b0b0b;
color:white;
margin:0;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
background:#111;
padding:25px;
border-radius:12px;
width:100%;
max-width:900px;
box-shadow:0 0 20px rgba(0,0,0,0.6);
}

h1{
text-align:center;
color:#1DB954;
margin-bottom:20px;
}

/* INPUT AREA */

.controls{
display:flex;
gap:10px;
margin-bottom:15px;
flex-wrap:wrap;
}

.controls input{
flex:1;
min-width:180px;
padding:10px;
border-radius:8px;
border:1px solid #333;
background:#1a1a1a;
color:white;
}

.controls button{
padding:10px 18px;
border:none;
border-radius:8px;
background:#1DB954;
color:white;
font-weight:bold;
cursor:pointer;
}

.controls button:hover{
background:#1ed760;
}

/* STATUS */

#error{
margin-top:10px;
color:#ff5c5c;
text-align:center;
}

#loading{
display:none;
text-align:center;
margin-top:15px;
}

/* SONG GRID */

.results{
margin-top:25px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:18px;
}

/* SONG CARD */

.song{
background:#1a1a1a;
border-radius:10px;
padding:12px;
text-align:center;
transition:0.2s;
display:flex;
flex-direction:column;
}

.song:hover{
transform:translateY(-5px);
background:#222;
}

/* ALBUM IMAGE */

.song img{
width:100%;
height:200px;
object-fit:cover;
border-radius:8px;
margin-bottom:10px;
}

/* TEXT */

.song-name{
font-weight:bold;
margin-bottom:4px;
}

.artist{
color:#aaa;
font-size:14px;
margin-bottom:6px;
}

/* SPOTIFY BUTTON */

.open{
margin-top:auto;
padding:7px 10px;
background:#1DB954;
color:white;
border-radius:20px;
text-decoration:none;
font-size:13px;
display:inline-block;
}

audio{
width:100%;
margin-top:6px;
}

</style>
</head>

<body>

<div class="container">

<h1>🎧 Mood Song Recommender</h1>

<div class="controls">
<input id="mood" placeholder="Mood (happy, sad, chill)">
<input id="language" placeholder="Language (english, hindi)">
<button id="searchBtn">Get Songs</button>
</div>

<div id="loading">Fetching songs...</div>
<div id="error"></div>

<div id="results" class="results"></div>

</div>

<script>

const moodInput=document.getElementById("mood")
const languageInput=document.getElementById("language")
const button=document.getElementById("searchBtn")

const resultsDiv=document.getElementById("results")
const errorDiv=document.getElementById("error")
const loadingDiv=document.getElementById("loading")

button.addEventListener("click",async function(){

errorDiv.textContent=""
resultsDiv.innerHTML=""

const mood=moodInput.value.trim()
const language=languageInput.value.trim()

if(!mood && !language){
errorDiv.textContent="Please enter mood or language"
return
}

loadingDiv.style.display="block"

try{

const response=await fetch("/get-songs",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({mood:mood,language:language})
})

const data=await response.json()

loadingDiv.style.display="none"

if(!response.ok){
errorDiv.textContent=data.error || "Server error"
return
}

if(!data.songs || data.songs.length===0){
errorDiv.textContent="No songs found"
return
}

data.songs.forEach(song=>{

const card=document.createElement("div")
card.className="song"

card.innerHTML=`

<img src="${song.album_art || ""}">

<div class="song-name">${song.name}</div>

<div class="artist">${song.artists}</div>

${song.preview_url ?
`<audio controls src="${song.preview_url}"></audio>`
: ""}

<a class="open" href="${song.url}" target="_blank">Open in Spotify</a>
`

resultsDiv.appendChild(card)

})

}catch(err){

loadingDiv.style.display="none"
errorDiv.textContent="Network error: "+err.message

}

})

</script>

</body>
</html>
